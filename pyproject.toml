[project]
name = "ellis"
version = "0.1.0"
description = "ELLIS: Efficient Loss and Leakage Invariant-reference Simulation. Exact masked Pauli-frame sampling of Clifford circuits with atom loss, common-reference certificates, and MSC S-proxy references."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "stim>=1.16"]

[project.optional-dependencies]
sinter = ["sinter>=1.15"]

[dependency-groups]
dev = ["pytest", "ruff", "ty", "sinter>=1.15", "pymatching>=2.4"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"   # persistent: rebuilds are incremental and Stim is fetched once
wheel.packages = ["src/python/ellis"]
cmake.build-type = "Release"
# A login node gives a user 32 cores and 30 GB, and ninja would start one compiler per core.
build.tool-args = ["-j8"]

[tool.uv]
# Rebuild the extension on `uv sync` / `uv run` when its sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "cmake/*.cmake" }, { file = "src/**/*.h" }, { file = "src/**/*.cc" }, { file = "src/**/CMakeLists.txt" }]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 130
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# The research code is written tersely (one-line `if`, `a; b`, lambdas, `l` as a name); keep it as is.
ignore = ["E701", "E702", "E731", "E741"]

[tool.ty.environment]
python = ".venv"
